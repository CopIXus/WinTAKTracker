name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $run = "${{ github.run_number }}"

          if ($ref -match '^refs/tags/v(\d+\.\d+\.\d+([.-].+)?)$') {
            $version = $Matches[1]
            $tag = "${{ github.ref_name }}"
            $name = "WinTAKTracker $version"
            $prerelease = "false"
            $kind = "tag"
          } elseif ($ref -eq 'refs/heads/main') {
            # Continuous SemVer: 0.1.<run_number> so /releases/latest and in-app updater stay ordered.
            # Tag prefix "build-" (not "v*") avoids a second workflow run when the release tag is created.
            $version = "0.1.$run"
            $tag = "build-$version"
            $name = "WinTAKTracker $version (main @$sha)"
            $prerelease = "false"
            $kind = "push"
          } else {
            throw "Unsupported ref '$ref'"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "kind=$kind" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "kind=$kind tag=$tag version=$version"

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $sha = "${{ steps.ver.outputs.sha }}"
          $info = if ("${{ steps.ver.outputs.kind }}" -eq "push") { "$version+$sha" } else { $version }
          $asm = if ($version -match '^\d+\.\d+\.\d+$') { "$version.0" } else { "0.1.0.0" }
          dotnet publish src/WinTAKTracker/WinTAKTracker.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$version `
            -p:AssemblyVersion=$asm `
            -p:FileVersion=$asm `
            -p:InformationalVersion=$info `
            -o publish

          dotnet publish src/WinTAKTracker.Service/WinTAKTracker.Service.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$version `
            -p:AssemblyVersion=$asm `
            -p:FileVersion=$asm `
            -p:InformationalVersion=$info `
            -o publish/service

      - name: Stage EXE
        shell: pwsh
        run: |
          $exe = "publish/WinTAKTracker.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe dist/WinTAKTracker.exe -Force
          if (-not (Test-Path "publish/service/WinTAKTracker.Service.exe")) {
            throw "Missing publish/service/WinTAKTracker.Service.exe"
          }
          Compress-Archive -Path "publish/service/*" -DestinationPath "dist/WinTAKTracker.Service-win-x64.zip" -Force
          Copy-Item "scripts/install-service.ps1" dist/install-service.ps1 -Force

      # Signing is optional: enabled only when secrets are present.
      # Prefer Azure Artifact Signing (Trusted Signing); else classic PFX + signtool.
      # See docs/code-signing.md — do not commit certificates or passwords.
      - name: Detect code-signing secrets
        id: sign
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          function Test-Secret([string]$v) {
            return -not [string]::IsNullOrWhiteSpace($v)
          }
          $trusted = @(
            (Test-Secret $env:AZURE_TENANT_ID),
            (Test-Secret $env:AZURE_CLIENT_ID),
            (Test-Secret $env:AZURE_CLIENT_SECRET),
            (Test-Secret $env:AZURE_TRUSTED_SIGNING_ENDPOINT),
            (Test-Secret $env:AZURE_TRUSTED_SIGNING_ACCOUNT),
            (Test-Secret $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE)
          ) -notcontains $false
          $pfx = (Test-Secret $env:CODE_SIGN_PFX_BASE64) -and (Test-Secret $env:CODE_SIGN_PFX_PASSWORD)
          if ($trusted) {
            $method = "trusted-signing"
          } elseif ($pfx) {
            $method = "pfx"
          } else {
            $method = "none"
          }
          "method=$method" >> $env:GITHUB_OUTPUT
          Write-Host "Code signing method: $method (signing enabled when secrets are set; see docs/code-signing.md)"

      - name: Sign with Azure Artifact Signing
        if: steps.sign.outputs.method == 'trusted-signing'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\dist\WinTAKTracker.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign with PFX (signtool)
        if: steps.sign.outputs.method == 'pfx'
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\WinTAKTracker.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) {
              throw "signtool.exe not found under Windows Kits. Install Windows SDK on the runner image."
            }
            Write-Host "Using $($signtool.FullName)"
            & $signtool.FullName sign `
              /fd SHA256 `
              /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $pfxPath `
              /p $env:CODE_SIGN_PFX_PASSWORD `
              $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit $LASTEXITCODE" }
            & $signtool.FullName verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit $LASTEXITCODE" }
          }
          finally {
            if (Test-Path $pfxPath) { Remove-Item -Force $pfxPath }
          }

      - name: Verify Authenticode signature
        if: steps.sign.outputs.method != 'none'
        shell: pwsh
        run: |
          $exe = "dist/WinTAKTracker.exe"
          $sig = Get-AuthenticodeSignature -FilePath $exe
          Write-Host "Status=$($sig.Status) Signer=$($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode signature not Valid after signing (Status=$($sig.Status))"
          }

      - name: Write SHA256 sidecar
        shell: pwsh
        run: |
          $exe = "dist/WinTAKTracker.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          Set-Content -Path dist/WinTAKTracker.exe.sha256 -Value "$hash  WinTAKTracker.exe" -NoNewline
          Write-Host "SHA256=$hash (computed after optional signing)"

      - name: Extract release notes
        id: notes
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $kind = "${{ steps.ver.outputs.kind }}"
          $sha = "${{ steps.ver.outputs.sha }}"
          $path = "CHANGELOG.md"
          if (-not (Test-Path $path)) { throw "CHANGELOG.md not found" }
          $lines = Get-Content $path
          $header = "## [$version]"
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith($header)) { $start = $i; break }
          }
          if ($start -lt 0) {
            if ($kind -eq "push") {
              $body = "Continuous build ``$version`` from ``main`` @ ``$sha``.`n`nSee [CHANGELOG.md](https://github.com/CopIXus/WinTAKTracker/blob/main/CHANGELOG.md) for notable changes."
            } else {
              $body = "Release $version`n`nSee [CHANGELOG.md](https://github.com/CopIXus/WinTAKTracker/blob/main/CHANGELOG.md)."
            }
          } else {
            $end = $lines.Count
            for ($j = $start + 1; $j -lt $lines.Count; $j++) {
              if ($lines[$j] -match '^## \[') { $end = $j; break }
            }
            $section = $lines[$start..($end - 1)] | Where-Object { $_ -notmatch '^\[.+\]:\s*https?://' }
            $body = ($section -join "`n").Trim()
            if ([string]::IsNullOrWhiteSpace($body)) {
              $body = "Release $version"
            }
          }
          $out = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $out -Value $body -Encoding utf8
          "file=$out" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          body_path: ${{ steps.notes.outputs.file }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: |
            dist/WinTAKTracker.exe
            dist/WinTAKTracker.exe.sha256
            dist/WinTAKTracker.Service-win-x64.zip
            dist/install-service.ps1
          fail_on_unmatched_files: true
          generate_release_notes: ${{ steps.ver.outputs.kind == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
